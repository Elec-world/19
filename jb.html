<!doctype html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>عالم الالكترونيات</title>
    <style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:radial-gradient(circle at 50% -10%,rgba(0,210,255,.16),transparent 38%),radial-gradient(circle at 10% 90%,rgba(110,70,255,.12),transparent 32%),#070a0f;color:#dbe7f5;font:15px/1.45 "Segoe UI",Tahoma,Arial,sans-serif}
#brand{text-align:center;padding:18px 14px 16px;background:linear-gradient(180deg,rgba(14,23,35,.98),rgba(8,12,18,.96));border-bottom:1px solid rgba(80,180,255,.22);box-shadow:0 8px 30px rgba(0,0,0,.28);overflow:hidden}
#brand:before{content:"";display:block;margin:-18px auto 12px;width:220px;height:2px;background:linear-gradient(90deg,transparent,#35d9ff,transparent);box-shadow:0 0 18px #35d9ff}
.brand-icon{width:58px;height:58px;display:block;margin:0 auto 9px;border-radius:16px;box-shadow:0 0 24px rgba(45,210,255,.28)}
#brand b{display:block;font-size:25px;font-weight:800;color:#fff;text-shadow:0 0 18px rgba(44,211,255,.28)}
#brand span{display:block;margin-top:3px;color:#7f94aa;font-size:11px;letter-spacing:.16em;direction:ltr}
#spin{position:fixed;top:calc(50% + 20px);left:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border:4px solid #1e2732;border-top-color:#35d9ff;border-radius:50%;animation:spin .9s linear infinite;box-shadow:0 0 20px rgba(53,217,255,.18)}
@keyframes spin{to{transform:rotate(360deg)}}
#msg{position:fixed;top:50%;left:0;right:0;transform:translateY(-50%);text-align:center;font-size:17px;letter-spacing:.3px;display:none;color:#ff9b93}
#wrap{width:min(700px,calc(100% - 28px));margin:22px auto;padding:22px 20px;background:rgba(13,18,27,.82);border:1px solid rgba(100,150,190,.16);border-radius:18px;box-shadow:0 18px 55px rgba(0,0,0,.35);backdrop-filter:blur(8px)}
#state{display:none;font-size:22px;font-weight:700;margin:0 0 8px;text-align:center}
#out{display:none;white-space:pre-wrap;font:12px/1.45 Consolas,monospace;background:#0d121a;border:1px solid #1e2732;border-radius:10px;padding:12px;height:calc(100vh - 150px);overflow-y:auto;direction:ltr;text-align:left}
#contacts{margin-top:16px;padding-top:15px;border-top:1px solid rgba(100,150,190,.13);display:grid;grid-template-columns:1fr 1fr;gap:10px}
.contact{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid rgba(100,150,190,.14);border-radius:12px;background:rgba(255,255,255,.025)}
.phone-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:rgba(39,197,255,.10);color:#40d8ff;font-size:18px}
.contact small{display:block;color:#8294a8;font-size:11px;margin-bottom:2px}
.contact a{color:#eaf7ff;text-decoration:none;direction:ltr;unicode-bidi:embed;font-weight:700;font-size:13px}
.contact a:hover{color:#4ddcff}
body.done #spin,body.fail #spin,body.log #spin,body.log #msg{display:none}
body.fail #msg{display:block}
body.log #wrap{padding:14px 18px}
body.log #state,body.log #out{display:block}
.ok,.safe{color:#7fd0a0}.bad,.danger{color:#ff837d}.warn{color:#ffd66e}code{color:#9fb3d0}
@media(max-width:560px){#contacts{grid-template-columns:1fr}#wrap{padding:20px 15px 16px}#brand b{font-size:22px}}
</style>
  </head>
  <body>
    <div id="brand">
      <svg class="brand-icon" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" aria-label="عالم الالكترونيات">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#28d8ff"/><stop offset="1" stop-color="#755cff"/></linearGradient></defs>
        <rect x="5" y="5" width="118" height="118" rx="30" fill="#0b121d" stroke="url(#g)" stroke-width="4"/>
        <path d="M28 50h72v28H28z" fill="none" stroke="url(#g)" stroke-width="5"/>
        <path d="M40 50V39m16 11V34m16 16V39m16 11V34" stroke="#55ddff" stroke-width="5" stroke-linecap="round"/>
        <path d="M38 78l-8 13m60-13 8 13" stroke="#8b79ff" stroke-width="5" stroke-linecap="round"/>
        <circle cx="42" cy="64" r="5" fill="#fff"/><circle cx="86" cy="64" r="5" fill="#fff"/>
        <path d="M51 68h26" stroke="#35d9ff" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <b>عالم الالكترونيات</b><span>ELECTRONIC WORLD</span>
    </div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
      <div id="contacts" aria-label="أرقام التواصل">
        <div class="contact"><div class="phone-icon">☎</div><div><small>حمزة البغدادي</small><a href="tel:07703548449">07703548449</a></div></div>
        <div class="contact"><div class="phone-icon">☎</div><div><small>محمد خالد</small><a href="tel:07705361282">07705361282</a></div></div>
      </div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
